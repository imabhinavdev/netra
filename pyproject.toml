[project]
name = "netra"
version = "0.1.1"
description = "CLI to install and manage a complete observability stack (Prometheus, Grafana, Loki, Promtail, Node Exporter) on Linux"
authors = [
    {name = "Abhinav Singh", email = "abhinavas430@gmail.com"},
]
dependencies = [
    "typer>=0.24.1",
    "rich>=13.0.0",
    "Jinja2>=3.1.0",
    "PyYAML>=6.0",
    "paramiko>=3.0.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
pytest = ">=7.0.0"


[tool.pdm.scripts]
netra = "python -m cli.main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        run: |
          pyinstaller --onefile --name netra --clean \
            --hidden-import typer \
            --hidden-import click \
            --hidden-import rich \
            --hidden-import rich.progress \
            --hidden-import jinja2 \
            --hidden-import yaml \
            --hidden-import paramiko \
            --collect-submodules typer \
            --collect-submodules click \
            --collect-submodules rich \
            --add-data "templates:templates" \
            --add-data "configs:configs" \
            --add-data "dashboards:dashboards" \
            --paths . \
            cli/main.py
          mkdir -p dist
          cp dist/netra dist/netra-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netra-linux-x86_64
          path: dist/netra-linux-x86_64

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version and tag
        id: meta
        run: |
          VERSION=$(grep '^version' pyproject.toml | cut -d '"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=release-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          for dir in release-artifacts/*/; do
            for f in "$dir"*; do
              [ -f "$f" ] && cp "$f" release-files/
            done
          done
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: netra ${{ steps.meta.outputs.version }} (${{ github.sha }})
          body: |
            Built from main @ ${{ github.sha }}
            ## Assets
            Linux x86_64 binary.
          files: release-files/*
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
